appId: com.siteorigin.builder
productName: SiteOrigin Builder
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
  - "!**/*.map"
# The media worker's image library loads native code, which cannot be loaded from inside the archive.
asarUnpack:
  - "**/node_modules/sharp/**/*"
  - "**/node_modules/@img/**/*"
# A complete, unmodified npm is copied into Resources/npm by build/after-pack.cjs.
afterPack: build/after-pack.cjs
# The app's own licence; build/after-pack.cjs writes THIRD_PARTY_NOTICES.txt beside it.
extraResources:
  - from: LICENSE
    to: LICENSE.txt
  - from: templates
    to: templates
  - from: resources/starter-assets
    to: resources/starter-assets
  # Theme pack releases built by `npm run build:packs`. The development fixtures ship too, hidden from the theme
  # picker, so a project switched to one while developing still opens for editing.
  - from: resources/packs
    to: resources/packs
  - from: resources/packs-dev
    to: resources/packs-dev

mac:
  category: public.app-category.graphics-design
  # Electron's stock Info.plist declares uses the app doesn't have: it denies every permission request except
  # clipboard writes, and src/main/index.ts turns Web Bluetooth off. A null here removes the key from the bundle.
  extendInfo:
    NSAudioCaptureUsageDescription: null
    NSBluetoothAlwaysUsageDescription: null
    NSBluetoothPeripheralUsageDescription: null
    NSCameraUsageDescription: null
    NSMicrophoneUsageDescription: null
  target: [dmg]
  icon: build/icon.png
  # Releases are built by hand (README.md, Releasing). build/after-pack.cjs signs every macOS build ad-hoc.
  # electron-builder then signs it again when it finds a "Developer ID Application" identity (in the keychain,
  # or from CSC_LINK / CSC_KEY_PASSWORD), and then notarizes it when it has notarization credentials, such as
  # APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
win:
  target: [nsis]
  icon: build/icon.png
linux:
  target: [AppImage]
  icon: build/icon.png
  # A main category and an additional one that goes with it, from the freedesktop.org menu specification.
  category: Graphics;Publishing
