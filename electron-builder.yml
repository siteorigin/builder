appId: com.siteorigin.builder
productName: SiteOrigin Builder
# One naming scheme for every installer: siteorigin-builder-0.1.0-mac-arm64.dmg, -win-x64.exe, -linux-x86_64.AppImage.
artifactName: ${name}-${version}-${os}-${arch}.${ext}
# The download domain the release workflows publish to (docs/releasing.md). Builds bundle it as the update feed in
# resources/app-update.yml, and electron-builder writes each platform's blockmaps for differential updates; the
# workflows write the feed's metadata files themselves (scripts/release/generate-update-metadata.ts).
publish:
  provider: generic
  url: https://downloads.siteorigin.com/releases/
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
  - "!**/*.map"
# The media worker's image library loads native code, which cannot be loaded from inside the archive.
asarUnpack:
  - "**/node_modules/sharp/**/*"
  - "**/node_modules/@img/**/*"
# A complete, unmodified npm is copied into Resources/npm by build/after-pack.cjs.
afterPack: build/after-pack.cjs
# The app's own licence; build/after-pack.cjs writes THIRD_PARTY_NOTICES.txt beside it.
extraResources:
  - from: LICENSE
    to: LICENSE.txt
  - from: templates
    to: templates
  - from: resources/starter-assets
    to: resources/starter-assets
  # Theme pack releases built by `npm run build:packs`. The development fixtures ship too, hidden from the theme
  # picker, so a project switched to one while developing still opens for editing.
  # A build's staging folders (.staging-<pid>) never ship, even one an interrupted build left behind.
  - from: resources/packs
    to: resources/packs
    filter: ["**/*", "!.staging*", "!.staging*/**"]
  - from: resources/packs-dev
    to: resources/packs-dev
    filter: ["**/*", "!.staging*", "!.staging*/**"]

mac:
  category: public.app-category.graphics-design
  # Electron's stock Info.plist declares uses the app doesn't have: it denies every permission request except
  # clipboard writes, and src/main/index.ts turns Web Bluetooth off. A null here removes the key from the bundle.
  extendInfo:
    NSAudioCaptureUsageDescription: null
    NSBluetoothAlwaysUsageDescription: null
    NSBluetoothPeripheralUsageDescription: null
    NSCameraUsageDescription: null
    NSMicrophoneUsageDescription: null
    # The macOS 26 icon, from the asset catalog build/after-pack.cjs adds (scripts/app-icon/build.mjs).
    CFBundleIconName: AppIcon
  # The DMG for people to download; the zip for updates, which Squirrel.Mac installs only from a zip.
  target: [dmg, zip]
  # The disk image's icon, and the app's on macOS before 26. Every icon file is written by scripts/app-icon/build.mjs.
  icon: build/icon.icns
  # Releases are built by .github/workflows/release.yml (docs/releasing.md). build/after-pack.cjs signs every
  # macOS build ad-hoc. electron-builder then signs it again when it finds a "Developer ID Application" identity
  # (in the keychain, or from CSC_LINK / CSC_KEY_PASSWORD), and then notarizes and staples it when APPLE_API_KEY
  # (the .p8 file's path), APPLE_API_KEY_ID and APPLE_API_ISSUER are all set.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
# The DMG is signed with the same identity when there is one, so it can carry its own notarization ticket.
dmg:
  sign: true
  # No blockmap for the DMG: the release workflow staples a notarization ticket into it after electron-builder
  # writes one, which would leave the map describing other bytes. Updates come from the zip's blockmap.
  writeUpdateInfo: false
win:
  target: [nsis]
  icon: build/icon.ico
linux:
  target: [AppImage]
  # One PNG per size, each drawn for it (scripts/app-icon/build.mjs).
  icon: build/icons
  # The picture a window shows in the title bar and taskbar (src/main/window-icon.ts): the executable carries none.
  extraResources:
    - from: build/icon-flat.png
      to: icon.png
  # A main category and an additional one that goes with it, from the freedesktop.org menu specification.
  category: Graphics;Publishing
