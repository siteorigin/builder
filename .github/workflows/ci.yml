name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  packaged:
    name: Packaged app (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx electron-vite build
      - name: Package (unpacked)
        run: npx electron-builder --dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2t64
      - name: Smoke test the packaged app (no system Node on PATH)
        if: runner.os != 'Linux'
        run: node tests/e2e/packaged.mjs
        env:
          WORK: ${{ runner.temp }}/so-packaged
      - name: Smoke test the packaged app (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a node tests/e2e/packaged.mjs
        env:
          WORK: ${{ runner.temp }}/so-packaged
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packaged-${{ matrix.os }}
          path: ${{ runner.temp }}/so-packaged/packaged-*.png
          if-no-files-found: ignore
