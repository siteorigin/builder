name: Release

# Runs the whole unit test suite, then builds the installers for a version tag
# (`vX.Y.Z`): a signed and notarized DMG for each Mac architecture, an NSIS
# installer for Windows and an AppImage for Linux, and attaches them to a draft
# GitHub release for that tag. Publishing the release stays a manual step
# (docs/releasing.md). A manual run does the same from any branch and keeps the
# installers as workflow artifacts only.
#
# Only macOS is signed. Windows has no Authenticode certificate yet, so
# SmartScreen warns; Linux AppImages are not signed.
#
# macOS secrets: MAC_CERTS (the Developer ID Application .p12, base64),
# MAC_CERTS_PASSWORD, APPLE_API_KEY (the App Store Connect API key's .p8
# contents), APPLE_API_KEY_ID, APPLE_API_ISSUER and APPLE_TEAM_ID.
on:
  push:
    tags:
      - "v*"
    # TEMPORARY: runs the workflow from this branch before it can be dispatched
    # from develop. Remove before merging.
    branches:
      - feature/release-signing
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The whole unit suite, never narrowed to a diff: no installer is built from a
  # tree whose unit tests fail. No e2e: that stays in the local stabilize pass and
  # the release checklist (docs/releasing.md).
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    # The whole suite on one runner takes about 20 minutes.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # No browser here: the unit tests that need Chromium skip themselves, and
      # PR CI and the local stabilize pass run them. The whole suite has
      # timing-sensitive tests that fail now and then on a busy runner (a
      # different one each run), so a failing test gets three more tries; one
      # that fails all four still stops the release.
      - run: npx vitest run --retry=3

  mac:
    name: macOS (${{ matrix.arch }})
    needs: unit
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each architecture builds on its own hardware, so `npm ci` installs
          # the native image library for the architecture being packaged.
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      # electron-builder signs only when it has a certificate and notarizes only
      # when it has all three API key values; a missing secret would otherwise
      # ship an unsigned or unnotarized build without failing.
      - name: Check the signing secrets
        env:
          MAC_CERTS: ${{ secrets.MAC_CERTS }}
          MAC_CERTS_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for name in MAC_CERTS MAC_CERTS_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::The $name secret is not set"
              missing=1
            fi
          done
          exit $missing

      - run: npm ci
      # The theme pack thumbnails are drawn in Chromium (`--require-previews`).
      - run: npx playwright install chromium

      # `npm run dist` in two halves, so the dependency installs above and the
      # compile here run without the signing credentials: only electron-builder
      # (and build/after-pack.cjs, which it runs) sees them.
      - name: Build the app
        run: |
          npm run build:packs -- --require-previews
          npx --no-install electron-vite build

      - name: Write the App Store Connect API key
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/apple"
          printf '%s\n' "$APPLE_API_KEY" > "$RUNNER_TEMP/apple/AuthKey.p8"

      - name: Package, sign and notarize
        env:
          CSC_LINK: ${{ secrets.MAC_CERTS }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/apple/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          DEBUG: electron-notarize*
        run: npx --no-install electron-builder --mac --${{ matrix.arch }} --publish never

      # electron-builder notarizes and staples the app; the DMG around it is
      # signed but needs its own notarization ticket so it opens without a
      # warning when downloaded.
      - name: Notarize and staple the DMG
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          shopt -s nullglob
          dmgs=(dist/*.dmg)
          if [[ ${#dmgs[@]} -ne 1 ]]; then
            echo "::error::Expected one DMG in dist/, found ${#dmgs[@]}"
            exit 1
          fi
          xcrun notarytool submit "${dmgs[0]}" --wait --timeout 30m \
            --key "$RUNNER_TEMP/apple/AuthKey.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER"
          xcrun stapler staple "${dmgs[0]}"

      - name: Verify the signature and notarization
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: scripts/release/verify-macos.sh "$APPLE_TEAM_ID" dist/*.dmg

      - name: Remove the App Store Connect API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/apple"

      - uses: actions/upload-artifact@v7
        with:
          name: mac-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error
          # A re-run of all jobs uploads under the same name again.
          overwrite: true

  windows:
    name: Windows (x64)
    needs: unit
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run dist -- --win --x64 --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: dist/*.exe
          if-no-files-found: error
          # A re-run of all jobs uploads under the same name again.
          overwrite: true

  linux:
    name: Linux (x64)
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run dist -- --linux --x64 --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: linux-x64
          path: dist/*.AppImage
          if-no-files-found: error
          # A re-run of all jobs uploads under the same name again.
          overwrite: true

  # A draft release is visible only to the repository's maintainers until it is
  # published by hand (the workflow artifacts above are public to signed-in
  # users while they last). Only a pushed tag makes one: a manual run, even on a
  # tag, keeps its installers as artifacts.
  draft-release:
    name: Draft GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [mac, windows, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: installers
      # Exactly the four installers this tag should have, by name, so a missing
      # artifact can't produce an incomplete release.
      - name: Collect the installers
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          expected=(
            "installers/mac-arm64/siteorigin-builder-$v-mac-arm64.dmg"
            "installers/mac-x64/siteorigin-builder-$v-mac-x64.dmg"
            "installers/windows-x64/siteorigin-builder-$v-win-x64.exe"
            "installers/linux-x64/siteorigin-builder-$v-linux-x86_64.AppImage"
          )
          for f in "${expected[@]}"; do
            [[ -f "$f" ]] || { echo "::error::Missing installer: $f"; exit 1; }
          done
          found="$(find installers -type f | wc -l)"
          if [[ "$found" -ne ${#expected[@]} ]]; then
            echo "::error::Expected ${#expected[@]} files in the artifacts, found $found:"
            find installers -type f
            exit 1
          fi
          printf '%s\n' "${expected[@]}" > installers.txt
      # A re-run fills in the draft an earlier attempt left; a published
      # release is never touched.
      - name: Create or update the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t files < installers.txt
          # Any lookup failure other than "no such release" stops the job, so a
          # transient API error never turns into a second create.
          if draft="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>lookup.err)"; then
            if [[ "$draft" != "true" ]]; then
              echo "::error::Release $GITHUB_REF_NAME is already published"
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          elif grep -q "release not found" lookup.err; then
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
              --title "SiteOrigin Builder ${GITHUB_REF_NAME#v}" --generate-notes
          else
            echo "::error::Could not look up release $GITHUB_REF_NAME: $(cat lookup.err)"
            exit 1
          fi
