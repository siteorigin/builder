name: Release (macOS)

# The macOS half of a release (the release skill, .agents/skills/release, runs
# all three): on a `vX.Y.Z` tag, the whole unit suite, then a Developer ID
# signed, notarized and stapled DMG and update zip for each architecture, the
# assembled update feed, and the publish to R2 (downloads.siteorigin.com). Each
# OS's workflow publishes the moment its own run is green, so one OS failing
# only delays that OS.
#
# A manual run with dry_run builds, signs and notarizes the same way and
# publishes nothing. Secrets: MAC_CERTS (the Developer ID Application .p12,
# base64), MAC_CERTS_PASSWORD, APPLE_API_KEY (the App Store Connect API key's
# .p8 contents), APPLE_API_KEY_ID, APPLE_API_ISSUER, APPLE_TEAM_ID, and for the
# publish R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_ENDPOINT, R2_BUCKET and
# (optional) WEBSITE_WEBHOOK_SECRET with the WEBSITE_REFRESH_URL variable.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: unit tests, build, sign, notarize and verify, without publishing"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# Tag runs on one ref queue behind each other; a dry run gets a group of its own.
concurrency:
  group: release-macos-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && github.run_id || 'release' }}
  cancel-in-progress: false

jobs:
  # The whole unit suite, never narrowed to a diff: no installer is built from a
  # tree whose unit tests fail. No e2e: that stays in the local stabilize pass.
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    # The whole suite on one runner takes about 20 minutes.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # No browser here: the unit tests that need Chromium skip themselves, and
      # PR CI and the local stabilize pass run them. The whole suite has
      # timing-sensitive tests that fail now and then on a busy runner (a
      # different one each run), so a failing test gets three more tries; one
      # that fails all four still stops the release.
      - run: npx vitest run --retry=3

  build:
    name: Build (${{ matrix.arch }})
    needs: unit-tests
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each architecture builds on its own hardware, so `npm ci` installs
          # the native image library for the architecture being packaged.
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      # electron-builder signs only when it has a certificate and notarizes only
      # when it has all three API key values; a missing secret would otherwise
      # ship an unsigned or unnotarized build without failing.
      - name: Check the signing secrets
        env:
          MAC_CERTS: ${{ secrets.MAC_CERTS }}
          MAC_CERTS_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for name in MAC_CERTS MAC_CERTS_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::The $name secret is not set"
              missing=1
            fi
          done
          exit $missing

      - run: npm ci
      # The theme pack thumbnails are drawn in Chromium (`--require-previews`).
      - run: npx playwright install chromium

      # `npm run dist` in two halves, so the dependency installs above and the
      # compile here run without the signing credentials: only electron-builder
      # (and build/after-pack.cjs, which it runs) sees them.
      - name: Build the app
        run: |
          npm run build:packs -- --committed --require-previews
          npx --no-install electron-vite build

      - name: Write the App Store Connect API key
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/apple"
          printf '%s\n' "$APPLE_API_KEY" > "$RUNNER_TEMP/apple/AuthKey.p8"

      # Signs, notarizes and staples the app, then packs it into the DMG and the
      # update zip, so the zip carries the stapled app.
      - name: Package, sign and notarize
        env:
          CSC_LINK: ${{ secrets.MAC_CERTS }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/apple/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          DEBUG: electron-notarize*
        run: npx --no-install electron-builder --mac --${{ matrix.arch }} --publish never

      # The DMG around the app is signed but needs its own notarization ticket
      # so it opens without a warning when downloaded. Apple's staple service
      # drops connections now and then, so stapling is retried.
      - name: Notarize and staple the DMG
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          shopt -s nullglob
          dmgs=(dist/*.dmg)
          if [[ ${#dmgs[@]} -ne 1 ]]; then
            echo "::error::Expected one DMG in dist/, found ${#dmgs[@]}"
            exit 1
          fi
          auth=(--key "$RUNNER_TEMP/apple/AuthKey.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER")
          submit_rc=0
          result="$(xcrun notarytool submit "${dmgs[0]}" --wait --timeout 30m --output-format json "${auth[@]}")" || submit_rc=$?
          echo "$result"
          status="$(node -e 'try { process.stdout.write(JSON.parse(process.argv[1]).status ?? "") } catch {}' "$result")"
          if [[ $submit_rc -ne 0 || "$status" != "Accepted" ]]; then
            # Apple's report names every file it rejected and why.
            id="$(node -e 'try { process.stdout.write(JSON.parse(process.argv[1]).id ?? "") } catch {}' "$result")"
            if [[ -n "$id" ]]; then xcrun notarytool log "$id" "${auth[@]}" || true; fi
            echo "::error::Apple did not accept the DMG (status: ${status:-unknown})"
            exit 1
          fi
          for attempt in 1 2 3; do
            if xcrun stapler staple "${dmgs[0]}"; then exit 0; fi
            echo "::warning::stapler staple attempt $attempt failed; retrying in 15s"
            sleep 15
          done
          echo "::error::Could not staple the DMG's notarization ticket"
          exit 1

      - name: Verify the signature and notarization
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          shopt -s nullglob
          zips=(dist/*.zip)
          if [[ ${#zips[@]} -ne 1 ]]; then
            echo "::error::Expected one update zip in dist/, found ${#zips[@]}"
            exit 1
          fi
          scripts/release/verify-macos.sh "$APPLE_TEAM_ID" dist/*.dmg "${zips[0]}"

      - name: Remove the App Store Connect API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/apple"

      - uses: actions/upload-artifact@v7
        with:
          name: mac-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
          if-no-files-found: error
          retention-days: 7
          # A re-run of all jobs uploads under the same name again.
          overwrite: true

  # Both architectures' installers in one folder with the feed that lists both
  # update zips: each architecture builds on its own runner, so only this job
  # sees them together.
  assemble:
    name: Assemble the macOS release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: ./.github/actions/resolve-update-metadata-prefix
      - uses: actions/download-artifact@v8
        with:
          pattern: mac-*
          path: release/
          merge-multiple: true
      - name: Write the update feed
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(release/*.dmg)
          zips=(release/*.zip)
          if [[ ${#dmgs[@]} -ne 2 || ${#zips[@]} -ne 2 ]]; then
            echo "::error::Expected a DMG and a zip for each of arm64 and x64, found ${#dmgs[@]} DMGs and ${#zips[@]} zips"
            ls -la release/
            exit 1
          fi
          node scripts/release/generate-update-metadata.ts mac "release/${UPDATE_METADATA_PREFIX}-mac.yml" release
          node scripts/release/validate-update-metadata.ts "release/${UPDATE_METADATA_PREFIX}-mac.yml"
          cat "release/${UPDATE_METADATA_PREFIX}-mac.yml"
      - uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: release/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  publish:
    name: Publish to R2
    needs: assemble
    if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/publish-release
        with:
          artifact_name: release-macos
          include_globs: "*.dmg *.zip *.blockmap"
          metadata_suffix: "-mac"
          release_platforms: mac
          r2_access_key_id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2_secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2_endpoint: ${{ secrets.R2_ENDPOINT }}
          r2_bucket: ${{ secrets.R2_BUCKET }}
          website_url: ${{ vars.WEBSITE_REFRESH_URL }}
          website_webhook_secret: ${{ secrets.WEBSITE_WEBHOOK_SECRET }}
