# The SiteOrigin Builder live session relay: one Worker and one SessionRoom Durable Object per live session.
# See README.md. `npm run relay:dev` from the repository root runs it locally on http://127.0.0.1:8787.
name = "siteorigin-live-relay"
main = "src/index.ts"
compatibility_date = "2026-11-23"

# The guest's viewer: the page's script, styles and the preview's reload bridge (viewer/). The Worker runs first for
# every request and serves these files only at the paths it names (src/index.ts), so nothing here is reachable by its
# own path, and no preview origin serves the viewer's files.
[assets]
directory = "viewer"
binding = "ASSETS"
run_worker_first = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "SessionRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SessionRoom"]

# New rooms per client IP address. Counted per Cloudflare location and approximate: an abuse guardrail, not a quota.
[[ratelimits]]
name = "ROOM_CREATION_LIMITER"
namespace_id = "7610"
simple = { limit = 6, period = 60 }

# Connections to one room per client IP address: hosts reconnecting and guests joining or resuming.
[[ratelimits]]
name = "ROOM_CONNECT_LIMITER"
namespace_id = "7611"
simple = { limit = 30, period = 60 }

# Tunables, in milliseconds. SESSION_SIGNING_KEY is a secret: `wrangler secret put SESSION_SIGNING_KEY` in production,
# relay/.dev.vars locally (see .dev.vars.example).
# RELAY_ORIGIN (the viewer's public origin, e.g. "https://example.live") and the routes for the apex and
# `*.` wildcard belong in a production environment only: with routes set, `wrangler dev` rewrites the request's host,
# and each room's preview is found by its host (`p-<label>.<relay host>`). See README.md, Deploying and operating.
[vars]
HOST_RECONNECT_GRACE_MS = "120000"
GUEST_RECONNECT_GRACE_MS = "120000"
HANDSHAKE_TIMEOUT_MS = "30000"
PREVIEW_HEAD_TIMEOUT_MS = "30000"
PREVIEW_IDLE_TIMEOUT_MS = "30000"

[dev]
ip = "127.0.0.1"
port = 8787
local_protocol = "http"
